name: Probar codigos

# Prueba en seco: descarga cada codigo desde la BCN, lo parsea y reporta.
# No publica nada ni toca el sitio. Se dispara a mano.
on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Correr la ingesta sobre los quince codigos
        run: python3 probar_codigos.py >> $GITHUB_STEP_SUMMARY
